version: 1
# nodejs: '22.13.0'
backend:
  phases:
    build:
      commands:
        - "# Execute Amplify CLI with the helper script"
        # Refresh lock in place before npm ci: works around a known npm bug with
        # @aws-amplify/data-construct bundled deps (aws-amplify/amplify-backend#3158)
        - npm install --package-lock-only --no-audit --no-fund
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm install --package-lock-only --no-audit --no-fund
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
