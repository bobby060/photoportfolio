version: 1
# nodejs: '22.13.0'
backend:
  phases:
    build:
      commands:
        - "# Execute Amplify CLI with the helper script"
        - npm i -g npm@11
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
